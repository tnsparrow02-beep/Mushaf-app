name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Organize files
        run: |
          mkdir -p www assets
          for f in index.html styles.css app.js sw.js manifest.json icon.svg; do [ -f "$f" ] && mv "$f" www/; done
          for f in icon-only.png icon-foreground.png icon-background.png; do [ -f "$f" ] && mv "$f" assets/; done
          ls -R www assets
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm install
      - run: npx cap add android
      - name: Generate app icons (optional)
        continue-on-error: true
        run: npx capacitor-assets generate --android --assetPath assets
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mushaf-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
